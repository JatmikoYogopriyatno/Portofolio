      - name: "settings"
        label: "Nama Situs dan SEO"
        icon: "settings"
        file: "content/settings.json"
        fields:
          - label: "Identitas Situs"
            name: "meta"
            widget: object
            fields:
              - { label: "Judul situs", name: "siteTitle", widget: "string", required: true, hint: "Tampil di tab browser dan hasil pencarian Google." }

              # IKON SITUS
              #
              # Gambar kecil di tab peramban dan di sebelah alamat situs pada
              # hasil pencarian Google. Berkasnya dibuat ulang otomatis tiap
              # kali situs dibangun, lihat scripts/generate-favicon.mjs, jadi
              # cukup diganti di sini lalu simpan.
              #
              # Gambarnya dipotong bulat dan diberi bingkai gradien, sama
              # seperti logo di navbar, supaya keduanya seragam.
              - { label: "Ikon situs", name: "favicon", widget: "image", required: false, hint: "Gambar kecil di tab peramban dan di hasil pencarian Google. Sebaiknya persegi, minimal 192x192 piksel, dan bagian pentingnya di tengah karena akan dipotong bulat. Kosongkan untuk memakai foto profilmu." }

              - { label: "Kode verifikasi Google", name: "googleVerification", widget: "string", required: false, hint: "Dipakai sekali untuk membuktikan ke Google bahwa situs ini milikmu, lalu boleh dibiarkan terisi selamanya. Tempel hanya kode di dalam tanda kutip content=\"...\" yang diberikan Google Search Console. Kosongkan kalau belum mendaftar. Langkah lengkapnya ada di data/README.md bagian 21." }
              - label: "Deskripsi singkat"
                name: "description"
                widget: object
                collapsed: false
                required: true
                hint: "Maksimal sekitar 160 karakter."
                fields:
                  - { label: "Bahasa Indonesia", name: "id", widget: "text", required: true }
                  - { label: "English (opsional)", name: "en", widget: "text", required: false }
              - { label: "Kata kunci", name: "keywords", widget: "list", required: false, label_singular: "Kata kunci" }
              - { label: "Gambar preview tautan", name: "ogImage", widget: "image", hint: "Ukuran 1200x630. Dibuat ulang otomatis oleh perintah npm run assets." }
              - { label: "Alamat situs", name: "baseUrl", widget: "string", hint: "Tanpa garis miring di akhir. Contoh: https://jatmikoyogop.vercel.app" }
              - { label: "Bahasa awal", name: "locale", widget: "select", options: ["id", "en"], hint: "Bahasa yang aktif saat halaman pertama dibuka." }
              - { label: "Tema awal", name: "defaultTheme", widget: "select", options: ["system", "light", "dark"], hint: "system berarti mengikuti pengaturan perangkat pengunjung." }
              - { label: "Warna bilah alamat, mode terang", name: "themeColorLight", widget: "color", required: false }
              - { label: "Warna bilah alamat, mode gelap", name: "themeColorDark", widget: "color", required: false }
          - label: "Sentuhan Interaktif"
            name: "appearance"
            widget: object
            collapsed: true
            hint: "Semua boleh dimatikan. Tidak ada yang rusak, halamannya hanya jadi lebih tenang."
            fields:
