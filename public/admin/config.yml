  # MASUKAN MASUK
  #
  # Kiriman dari tamu lewat formulir di situs. Berkasnya dibuat sendiri oleh
  # situs, jadi di sini kamu hanya membaca, menandai, dan menghapus. Isinya
  # tidak pernah ditampilkan di situs.
  # ------------------------------------------------------------------------
  - name: "masukan"
    label: "Masukan Masuk"
    icon: "inbox"
    label_singular: "Masukan"
    folder: "content/feedback"
    create: false
    delete: true
    format: "json"
    extension: "json"
    summary: "{{fields.nama}} | {{fields.pesan}}"
    sortable_fields: ["waktu", "dibaca"]
    view_filters:
      - { label: "Belum dibaca", field: "dibaca", pattern: false }
      - { label: "Sudah dibaca", field: "dibaca", pattern: true }
    fields:
      - { label: "Waktu kirim", name: "waktu", widget: "datetime", readonly: true }
      - { label: "Nama pengirim", name: "nama", widget: "string", required: false, readonly: true, hint: "Kosong berarti pengirim memilih tidak mencantumkan nama." }
      - { label: "Kontak pengirim", name: "kontak", widget: "string", required: false, readonly: true, hint: "Kosong berarti pengirim tidak ingin dibalas." }
      - { label: "Isi masukan", name: "pesan", widget: "text", readonly: true }
      - { label: "Sudah dibaca", name: "dibaca", widget: "boolean", default: false, required: false, hint: "Centang setelah kamu membacanya, supaya yang baru gampang dikenali." }
      - { label: "Catatan pribadi", name: "catatan", widget: "text", required: false, hint: "Catatan untuk dirimu sendiri. Tidak pernah tampil di situs." }
