      - name: "education"
        label: "Pendidikan"
        icon: "school"
        file: "content/education.json"
        fields:
          - label: "Riwayat pendidikan"
            name: "items"
            widget: list
            collapsed: true
            minimize_collapsed: true
            label_singular: "Jenjang"
            summary: "{{fields.school}}"
            hint: "Tampil di bagian Pendidikan. Taruh jenjang tertinggi di atas."
            fields:
              # Dipakai halaman CV Peneliti untuk menaruh tiap jenjang di
              # kolomnya sendiri. Sengaja jadi pilihan, bukan isian bebas:
              # tabelnya mencocokkan isi kolom ini dengan S1, S2, dan S3 persis
              # seperti tertulis, jadi salah ketik satu huruf membuat satu
              # kolom kosong tanpa pesan kesalahan apa pun.
              - { label: "Jenjang", name: "level", widget: "select", required: false, options: ["S1", "S2", "S3"], hint: "Menentukan kolom mana yang diisi di tabel Riwayat Pendidikan pada CV Peneliti. Kosongkan untuk jenjang selain ketiganya, misalnya SMA atau D3." }
              - label: "Jenjang dan jurusan"
                name: "degree"
                widget: object
                collapsed: false
                required: true
                fields:
                  - { label: "Bahasa Indonesia", name: "id", widget: "string", required: true }
                  - { label: "English (opsional)", name: "en", widget: "string", required: false }
              - { label: "Nama sekolah atau kampus", name: "school", widget: "string" }
              - { label: "Kota", name: "location", widget: "string", required: false, hint: "Contoh: Bengkulu, Indonesia. Format CV Harvard menaruhnya tepat setelah nama kampus di baris yang sama. Cukup kota, tidak perlu alamat jalan." }
              - { label: "Rentang waktu", name: "period", widget: "string", hint: "Contoh: 2022 - 2026. Nama bulan boleh ditulis lengkap, nanti disingkat otomatis supaya seragam." }
              - label: "Nilai akhir"
                name: "gpa"
                widget: object
                collapsed: false
                required: false
                hint: "Kosongkan kalau tidak ingin ditampilkan."
                fields:
                  - { label: "Bahasa Indonesia", name: "id", widget: "string", required: false }
                  - { label: "English (opsional)", name: "en", widget: "string", required: false }
              # Tiga kolom di bawah ini mengisi tabel Riwayat Pendidikan di
              # halaman CV Peneliti. Di halaman utama yang tampil tetap kolom
              # Catatan, jadi ketiganya boleh dikosongkan kalau kamu tidak
              # memakai CV Peneliti.
              - label: "Bidang ilmu"
                name: "fieldOfStudy"
                widget: object
                collapsed: false
                required: false
                fields:
                  - { label: "Bahasa Indonesia", name: "id", widget: "string", required: false }
                  - { label: "English (opsional)", name: "en", widget: "string", required: false }
              - label: "Judul skripsi, tesis, atau disertasi"
                name: "thesis"
                widget: object
                collapsed: false
                required: false
                fields:
                  - { label: "Bahasa Indonesia", name: "id", widget: "text", required: false }
                  - { label: "English (opsional)", name: "en", widget: "text", required: false }
              - label: "Nama pembimbing atau promotor"
                name: "supervisor"
                widget: object
                collapsed: false
                required: false
                hint: "Pisahkan dengan titik koma kalau lebih dari satu."
                fields:
                  - { label: "Bahasa Indonesia", name: "id", widget: "text", required: false }
                  - { label: "English (opsional)", name: "en", widget: "text", required: false }
              - label: "Catatan"
                name: "notes"
                widget: object
                collapsed: false
                required: false
                hint: "Tampil di kartu Pendidikan pada halaman utama."
                fields:
                  - { label: "Bahasa Indonesia", name: "id", widget: "text", required: false }
                  - { label: "English (opsional)", name: "en", widget: "text", required: false }
              - { label: "Logo", name: "logo", widget: "image", required: false }
              - { label: "Foto dokumentasi", name: "image", widget: "image", required: false, hint: "Rasio 16:9 atau 4:3. Misalnya foto wisuda atau suasana kampus. Kosongkan kalau belum ada." }
              - label: "Keterangan foto"
                name: "imageAlt"
                widget: object
                collapsed: false
                required: false
                hint: "Menjelaskan isi foto untuk pembaca yang tidak bisa melihatnya."
                fields:
                  - { label: "Bahasa Indonesia", name: "id", widget: "string", required: false }
                  - { label: "English (opsional)", name: "en", widget: "string", required: false }

              # BERKAS YANG BISA DIUNDUH PENGUNJUNG
              #
              # Sama persis dengan yang ada di menu Pengalaman. Muncul sebagai
              # tombol kecil di bawah catatan pada kartu ini. Bebas jenis apa
              # saja: ijazah, transkrip nilai, sertifikat akreditasi, atau
              # dokumen lain. Jenis berkasnya dikenali sendiri dari nama
              # berkasnya, jadi ikon dan labelnya tidak perlu kamu atur.
              - label: "Berkas untuk diunduh"
                name: "files"
                widget: list
                required: false
                collapsed: true
                minimize_collapsed: true
                label_singular: "Berkas"
                summary: "{{fields.label.id}}"
                hint: "Opsional. Tampil sebagai tombol unduh di kartu ini."
                fields:
                  - label: "Nama tombol"
                    name: "label"
                    widget: object
                    collapsed: false
                    required: false
                    hint: "Contoh: Ijazah, Transkrip Nilai, Sertifikat Akreditasi. Kalau dikosongkan, dipakai nama berkasnya."
                    fields:
                      - { label: "Bahasa Indonesia", name: "id", widget: "string", required: false }
                      - { label: "English (opsional)", name: "en", widget: "string", required: false }
                  - { label: "Berkas", name: "file", widget: "file", required: true, hint: "PDF, foto, dokumen, apa saja." }

